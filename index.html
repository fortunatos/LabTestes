<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abrir no Chrome via Intent</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
        }
        .btn-chrome {
            display: inline-block;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background-color: #1a73e8;
            text-decoration: none;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background 0.3s;
        }
        .btn-chrome:hover {
            background-color: #1557b0;
        }
    </style>
</head>
<body>

    <!-- Link com a Intent corrigida para abrir o Google Chrome no Android -->
    <a class="btn-chrome" href="com.android.chrome://google.com#Intent;scheme=https;package=com.android.chrome;end">
        Abrir no Chrome
    </a>

</body>
</html>
