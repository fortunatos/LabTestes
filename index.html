<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abrir no Chrome via Esquema Direto</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
        }
        .btn-chrome {
            display: inline-block;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background-color: #1a73e8;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <!-- Link usando o esquema direto do Google Chrome -->
    <a class="btn-chrome" href="googlechrome://navigate?url=https://google.com">
        Abrir no Chrome
    </a>

</body>
</html>
